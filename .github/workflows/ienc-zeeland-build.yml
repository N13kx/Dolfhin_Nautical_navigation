name: IENC Zeeland Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.2.1b-official-ienc-integration
    paths:
      - 'data/nautical/chart-source/**'
      - 'scripts/nautical/**'
      - 'test/nautical/**'
      - '.github/workflows/ienc-zeeland-build.yml'

permissions:
  contents: read

jobs:
  build-ienc:
    runs-on: ubuntu-latest
    container:
      image: osgeo/gdal:ubuntu-small-3.2.2
      options: --user 0

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.2.1b-official-ienc-integration
          fetch-depth: 1

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove obsolete duplicate pilot sources from build workspace
        shell: bash
        run: |
          rm -f data/nautical/chart-source/1R76W8LI_1783372678701.000
          rm -f data/nautical/chart-source/1R7788RI_1783372678701.000

      - name: Verify pinned GDAL and S57
        shell: bash
        run: |
          set -euo pipefail
          echo "GDAL: $(gdal-config --version)"
          test "$(gdal-config --version)" = "3.2.2"
          ogrinfo --formats | grep -q S57
          ogrinfo data/nautical/chart-source/1R76W8LI.000 DSID -so

          # build.sh expects GDAL tools below ~/.nix-profile/bin.
          mkdir -p "$HOME/.nix-profile/bin"
          ln -sf "$(command -v gdal-config)" "$HOME/.nix-profile/bin/gdal-config"
          ln -sf "$(command -v ogrinfo)" "$HOME/.nix-profile/bin/ogrinfo"
          ln -sf "$(command -v ogr2ogr)" "$HOME/.nix-profile/bin/ogr2ogr"

      - name: Run Dolphin IENC builder
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/nautical/build.sh . | tee /tmp/ienc-build.log

      - name: Verify published catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/dolphin/public/nautical/catalog.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(`catalog total=${c.totalCells} pass=${c.passCells} fail=${c.failCells}`);
          if (c.totalCells !== 61) throw new Error(`Expected 61 cells, got ${c.totalCells}`);
          if (c.passCells !== 61) throw new Error(`Expected 61 PASS cells, got ${c.passCells}`);
          if (c.failCells !== 0) throw new Error(`Expected 0 FAIL cells, got ${c.failCells}`);
          const w = c.cells.find(x => x.cellId === '1R76W8LI');
          if (!w) throw new Error('1R76W8LI missing from catalog');
          if (String(w.edition) !== '80') throw new Error(`1R76W8LI expected edition 80, got ${w.edition}`);
          NODE

      - name: Package validated Zeeland output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dolphin-ienc-artifact
          cp -a artifacts/dolphin/public/nautical /tmp/dolphin-ienc-artifact/nautical
          cp data/nautical/catalog.json /tmp/dolphin-ienc-artifact/catalog.audit.json
          node <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('/tmp/dolphin-ienc-artifact/nautical/catalog.json','utf8'));
          fs.writeFileSync('/tmp/dolphin-ienc-artifact/BUILD-VERIFIED.txt', [
            'Dolphin IENC Zeeland build',
            `totalCells=${c.totalCells}`,
            `passCells=${c.passCells}`,
            `failCells=${c.failCells}`,
            `builtAt=${c.builtAt}`,
            'GDAL=3.2.2',
            'S57=present',
            'STATUS=VALIDATED_FOR_EXPERIMENTAL_ALPHA',
            'Not for navigation'
          ].join('\n') + '\n');
          NODE

      - name: Upload validated Zeeland artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-ienc-zeeland-validated
          path: /tmp/dolphin-ienc-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo '--- IENC build tail ---'
          tail -n 80 /tmp/ienc-build.log 2>/dev/null || true
          if [ -f artifacts/dolphin/public/nautical/catalog.json ]; then
            node -e "const c=require('./artifacts/dolphin/public/nautical/catalog.json'); console.log({totalCells:c.totalCells,passCells:c.passCells,failCells:c.failCells,builtAt:c.builtAt})"
          fi
